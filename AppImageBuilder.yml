version: 1
AppDir:
  path: build/linux/x64/release/bundle
  app_info:
    id: com.alex.new_messenger
    name: new_messenger
    icon: utilities-terminal
    exec: new_messenger
    version: 1.0.0
  apt:
    arch: amd64
    include:
      - libgtk-3-0
      - libglib2.0-0
      - libsecret-1-0
      - libnotify4
      - libasound2
      - libpulse0
      - libgstreamer1.0-0
      - libgstreamer-plugins-base1.0-0
    sources:
      - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ jammy main universe'

AppImage:
  arch: x64
  update-information: none