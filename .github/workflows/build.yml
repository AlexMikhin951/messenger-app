name: Flutter Build Linux
on: [push] # Сборка будет запускаться каждый раз, когда ты пушишь код

jobs:
  build:
    runs-on: ubuntu-latest # Используем чистую Ubuntu от GitHub
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev libnm-dev libguestfs-dev libcanberra-gtk3-module libnotify-dev libasound2-dev libpulse-dev libsecret-1-dev libgstreamer1.0-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - run: flutter pub get
      - run: flutter build linux --release

      - name: Upload Build
        uses: actions/upload-artifact@v3
        with:
          name: linux-app
          path: build/linux/x64/release/bundle/