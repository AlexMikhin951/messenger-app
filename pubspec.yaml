name: new_messenger
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  pocketbase: ^0.23.2
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_webrtc: ^1.3.0
  app_links: ^7.0.0
  url_launcher: ^6.3.1
  local_notifier: ^0.1.5
