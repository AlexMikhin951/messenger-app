  livekit_client: ^2.6.3
  dart_jsonwebtoken: ^3.3.1
  permission_handler: ^11.3.0
  flutter_v2ray: ^1.0.10
  dio: ^5.9.1
  path_provider: ^2.1.5
  wakelock_plus: ^1.2.8
  open_filex: ^4.7.0
